version: 2

# Playwright is bumped by hand, never by Dependabot. The `playwright` pin in the `dev` extra of
# pyproject.toml and the Playwright base image in the Dockerfile must change TOGETHER, in one PR:
# each Playwright release expects exactly one Chromium revision, and the image carries that revision
# (see the comment at the top of the Dockerfile). Bumping only one of them breaks level 2 at
# `launch`. Both are therefore ignored below.

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: playwright

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # mcr.microsoft.com/playwright/python, with or without the registry in the name.
      - dependency-name: "*playwright/python*"
