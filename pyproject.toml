[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skener"
dynamic = ["version"]
description = "Skener sajtova — rangira domene po tome koji zaslužuju pun ručni audit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Milos Lazic", email = "miloslazic458@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["website audit", "seo", "accessibility", "performance", "crawler", "lead triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
# Playwright je zakucan: paket traži tačno svoju reviziju Chromium-a, pa nadogradnja
# bez `playwright install` obori sve browser testove (vidi `chromium_se_pokrece`).
dev = ["pytest>=8", "pytest-cov==6.0.0", "playwright==1.56.0", "ruff>=0.6", "jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/lazicmilos/skener"
Repository = "https://github.com/lazicmilos/skener"
Issues = "https://github.com/lazicmilos/skener/issues"
Changelog = "https://github.com/lazicmilos/skener/blob/main/CHANGELOG.md"

[project.scripts]
skener = "skener.cli:main"

[tool.setuptools.packages.find]
include = ["skener*"]

# Šema JSON izveštaja ide uz paket: kupac koda i web aplikacija validiraju po njoj.
[tool.setuptools.package-data]
skener = ["schema/*.json"]

[tool.setuptools.dynamic]
version = { attr = "skener.__version__" }


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = [
    "live: pravi mrežni prolaz nad ispitnim skupom; iskljucen po defaultu (pytest -m live)",
    "browser: trazi instaliran Playwright/Chromium; preskace se ako ga nema",
]

# Mutaciono testiranje (docs/plan-testiranja.md): moduli sa logikom.
# Nov modul pod skener/ je obuhvaćen sam, osim ako je u do_not_mutate. Zato čisti
# moduli (poruke, diff, ishodi, klasifikacija adresa) ne idu u fetch/* ni report/*.
# mutmut 3.2.3 pokreće ceo skup testova; izbor testova iz podešavanja ne čita.
# Radi samo na Linux-u, pa kroz Docker:
#   docker compose run --rm skener python scripts/mutacije.py
[tool.mutmut]
paths_to_mutate = ["skener/"]
do_not_mutate = [
    "skener/__init__.py", "skener/cli.py", "skener/pipeline.py", "skener/models.py", "skener/store.py",
    "skener/fetch/*", "skener/report/*",
]
also_copy = ["skener.toml", "skener/schema/"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
