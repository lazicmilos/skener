name: prolaz

# Pravi prolaz nad listom domena, sa brze veze (Z-51). Pokreće ga vlasnik ručno:
# Actions → prolaz → Run workflow. Liste i rezultati po domenu ne ulaze u repo (pravilo 7):
# lista je tajna repoa (LISTA_A, LISTA_B; CSV kao rad/leads.csv), a rezultati su privatan
# artefakt koji se briše posle 7 dana. Ko skenira ide u User-Agent iz tajni SKENER_NAZIV i
# SKENER_KONTAKT.
on:
  workflow_dispatch:
    inputs:
      lista:
        description: "Lista domena"
        type: choice
        options: [LISTA_A, LISTA_B]
        default: LISTA_A

jobs:
  prolaz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker compose build

      - name: Lista iz tajne
        env:
          LISTA: ${{ secrets[inputs.lista] }}
        run: |
          mkdir -p rad
          printf '%s\n' "$LISTA" > rad/lista.csv
          test "$(wc -l < rad/lista.csv)" -gt 1 || { echo "::error::tajna ${{ inputs.lista }} je prazna"; exit 1; }

      - name: Prolaz
        shell: bash
        env:
          SKENER_NAZIV: ${{ secrets.SKENER_NAZIV }}
          SKENER_KONTAKT: ${{ secrets.SKENER_KONTAKT }}
        run: |
          export SKENER_UID=$(id -u) SKENER_GID=$(id -g)
          docker compose run --rm -T skener skener scan /rad/lista.csv --out /rad/prolaz 2>&1 | tee rad/prolaz.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prolaz-${{ inputs.lista }}-${{ github.run_number }}
          path: |
            rad/prolaz
            rad/prolaz.log
          retention-days: 7
